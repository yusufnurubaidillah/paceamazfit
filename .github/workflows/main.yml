name: Build Amazfit Pace APK (Android 5.1)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle 7.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'

      - name: 5. Persiapkan Proyek Android
        run: |
          set -e
          if ls *.zip 1> /dev/null 2>&1; then
            unzip -o *.zip || true
          fi
          if [ ! -f "settings.gradle" ] && [ -f */settings.gradle ]; then
            cp -r */* . || true
          fi
          if [ -f "build.gradle" ]; then
            sed -i "s/3.4.2/7.4.2/g" build.gradle || true
            sed -i "s/3.5.3/7.4.2/g" build.gradle || true
          fi
          if [ -f "app/build.gradle" ]; then
            sed -i "s/compileSdkVersion 22/compileSdkVersion 33/g" app/build.gradle || true
            sed -i "s/buildToolsVersion.*/buildToolsVersion \"33.0.2\"/g" app/build.gradle || true
          fi

      - name: 6. Kompilasi APK Android 5.1
        run: |
          chmod +x gradlew 2>/dev/null || true
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 7. Simpan File APK (Siap Unduh)
        uses: actions/upload-artifact@v4
        with:
          name: AmazfitPace-Reminder-Sholat-Jepara-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
