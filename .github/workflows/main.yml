name: Build Amazfit Pace APK (Android 5.1)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 5. Build APK Android 5.1
        run: |
          # Otomatis deteksi folder jika file berada di dalam subfolder
          if [ ! -f "settings.gradle" ] && [ -f */settings.gradle ]; then
            cd */
          fi
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: 6. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmazfitPace-Reminder-Sholat-Jepara-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 14
