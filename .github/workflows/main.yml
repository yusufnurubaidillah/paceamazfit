name: Build Amazfit Pace APK (Android 5.1)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 3. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 4. Build APK Smartwatch (Otomatis & Kompatibel)
        run: |
          set -e
          # Jika ada file zip yang diunggah, ekstrak otomatis
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Mengekstrak file zip..."
            unzip -o *.zip || true
          fi

          # Jika file ada di dalam subfolder, masuk ke foldernya
          if [ ! -f "settings.gradle" ] && [ -f */settings.gradle ]; then
            cd */
          fi

          # Jika proyek Android belum ada, buat otomatis wrapper Android 5.1
          if [ ! -f "settings.gradle" ]; then
            echo "Membuat kerangka Android 5.1 otomatis..."
            mkdir -p app/src/main/assets/www
            mkdir -p app/src/main/java/com/amazfit/remindersholat/jepara
            mkdir -p app/src/main/res/values

            if [ -d "www" ]; then
              cp -r www/* app/src/main/assets/www/ || true
            else
              find . -maxdepth 2 \( -name "*.html" -o -name "*.js" -o -name "*.css" -o -name "*.png" -o -name "*.jpg" \) -exec cp {} app/src/main/assets/www/ \; || true
            fi

            echo "include ':app'" > settings.gradle

            cat << 'EOF' > build.gradle
            buildscript {
                repositories {
                    google()
                    mavenCentral()
                }
                dependencies {
                    classpath 'com.android.tools.build:gradle:7.4.2'
                }
            }
            allprojects {
                repositories {
                    google()
                    mavenCentral()
                }
            }
            EOF

            cat << 'EOF' > app/build.gradle
            plugins {
                id 'com.android.application'
            }
            android {
                namespace 'com.amazfit.remindersholat.jepara'
                compileSdk 33
                defaultConfig {
                    applicationId "com.amazfit.remindersholat.jepara"
                    minSdk 21
                    targetSdk 22
                    versionCode 1
                    versionName "1.0.0"
                }
                buildTypes {
                    debug {
                        debuggable true
                    }
                }
            }
            EOF

            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.WAKE_LOCK" />
                <uses-permission android:name="android.permission.VIBRATE" />
                <application
                    android:allowBackup="true"
                    android:icon="@android:drawable/sym_def_app_icon"
                    android:label="Reminder Sholat Jepara"
                    android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true"
                        android:screenOrientation="portrait">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF

            cat << 'EOF' > app/src/main/java/com/amazfit/remindersholat/jepara/MainActivity.java
            package com.amazfit.remindersholat.jepara;

            import android.app.Activity;
            import android.os.Bundle;
            import android.view.View;
            import android.view.WindowManager;
            import android.webkit.WebSettings;
            import android.webkit.WebView;
            import android.webkit.WebViewClient;

            public class MainActivity extends Activity {
                private WebView mWebView;

                @Override
                protected void onCreate(Bundle savedInstanceState) {
                    super.onCreate(savedInstanceState);
                    getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                    getWindow().getDecorView().setSystemUiVisibility(
                        View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                        | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                        | View.SYSTEM_UI_FLAG_FULLSCREEN
                        | View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                    );

                    mWebView = new WebView(this);
                    mWebView.setBackgroundColor(0xFF000000);
                    WebSettings settings = mWebView.getSettings();
                    settings.setJavaScriptEnabled(true);
                    settings.setDomStorageEnabled(true);
                    settings.setAllowFileAccess(true);
                    settings.setAllowFileAccessFromFileURLs(true);
                    settings.setAllowUniversalAccessFromFileURLs(true);

                    mWebView.setWebViewClient(new WebViewClient());
                    mWebView.loadUrl("file:///android_asset/www/index.html");
                    setContentView(mWebView);
                }

                @Override
                public void onBackPressed() {
                    if (mWebView != null && mWebView.canGoBack()) {
                        mWebView.goBack();
                    } else {
                        super.onBackPressed();
                    }
                }
            }
            EOF
          fi

          echo "Merakit APK..."
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle wrapper --gradle-version 7.5.1 || true
            chmod +x gradlew || true
            ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace
          fi

      - name: 5. Simpan Hasil File APK (Siap Unduh)
        uses: actions/upload-artifact@v4
        with:
          name: AmazfitPace-Reminder-Sholat-Jepara-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 14
